apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {

    ndkVersion "28.0.13004108"

    defaultConfig {
        applicationId "com.thalesgroup.gemalto.fido2.sample"
        minSdkVersion 26
        compileSdk 36
        targetSdkVersion 35
        versionCode 1
        versionName "4.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        fido {
            storeFile     file('sign.keystore')
            storePassword 'thalesfido2'
            keyAlias      'alias'
            keyPassword   'thalesfido2'
        }
    }

    buildFeatures {
        compose true
        buildConfig true //this line enables BuildConfig generation
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fido
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.fido
        }
    }



   compileOptions {
       sourceCompatibility JavaVersion.VERSION_17
       targetCompatibility JavaVersion.VERSION_17
   }
    namespace 'com.thalesgroup.gemalto.fido2.sample'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }
    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation project(":lib:fido2ui")
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    debugApi files(project(':lib:fido2').projectDir.path + "/libs/secure-log/android/SecureLogAPI/release/libsecurelog.jar")

    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'
    implementation "androidx.biometric:biometric:1.1.0"
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'com.google.android.gms:play-services-fido:20.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling:1.7.8'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.compose.material:material:1.7.8'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'

    implementation "androidx.credentials:credentials:1.2.2"
    // Android 13 and below.
    implementation "androidx.credentials:credentials-play-services-auth:1.2.2"
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'
}
