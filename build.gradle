buildscript {
	ext.kotlin_version = '1.9.24'
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.9.2'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
		classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.8.9'
	}
	System.setProperty("dexguard.license", "${projectDir}/dexguard-license.txt")
}

plugins {
	id 'jacoco'
}

allprojects {
	repositories {
		google()
		mavenCentral()

		// Mobile FIDO SDK is distributed via Thales JFrog Artifactory (public Maven repo).
		// The repository URL defaults to the public path below; provide your Artifactory
		// token via the JFROG_TOKEN environment variable or a gradle.properties entry.
		def jfrogUrl = System.getenv("JFROG_URL_MAVEN") ?: project.findProperty("JFROG_URL_MAVEN") ?: "https://thalescpliam.jfrog.io/artifactory/onegini-sdk"
		def jfrogToken = System.getenv("JFROG_TOKEN") ?: project.findProperty("JFROG_TOKEN")

		if (!jfrogToken) {
			throw new GradleException("Missing JFROG configuration! Provide JFROG_TOKEN (and optionally JFROG_URL_MAVEN) via an environment variable or gradle.properties.")
		}

		maven {
			url = jfrogUrl
			credentials(HttpHeaderCredentials) {
				name = "Authorization"
				value = "Bearer " + jfrogToken
			}
			authentication {
				header(HttpHeaderAuthentication)
			}
		}
	}

	ext {
		compileSdkVersion = 35
		minSdkVersion = 26
		targetSdkVersion = 35
		libsPath = "${projectDir}/libs"
	}
}

task clean(type: Delete) { delete rootProject.buildDir }